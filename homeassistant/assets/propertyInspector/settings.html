<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<style>
			:root { color-scheme: light dark; --fg: #e6e6e6; --muted: #9a9a9a; --field: #3d3d3d; --border: #555; --accent: #4f8ef7; --bad: #ff6b6b; --good: #5fd18b; }
			@media (prefers-color-scheme: light) { :root { --fg: #222; --muted: #666; --field: #fff; --border: #bbb; } }
			body { margin: 0; padding: 8px 10px; font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg); background: transparent; }
			.row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
			.row > label:first-child { flex: 0 0 96px; color: var(--muted); }
			input[type="text"], input[type="url"], input[type="password"], input[type="number"] { flex: 1; min-width: 0; box-sizing: border-box; padding: 4px 6px; border-radius: 4px; border: 1px solid var(--border); background: var(--field); color: var(--fg); font: inherit; }
			button { padding: 4px 10px; border-radius: 4px; border: 1px solid var(--border); background: var(--field); color: var(--fg); font: inherit; cursor: pointer; }
			button:hover { border-color: var(--accent); }
			.hint { color: var(--muted); font-size: 11px; margin: -2px 0 6px 104px; }
			#status { margin: 8px 0; font-weight: 600; }
			#status.Ready { color: var(--good); } #status.AuthFailed, #status.Unreachable { color: var(--bad); }
			details { margin-top: 8px; } summary { cursor: pointer; color: var(--muted); margin-bottom: 4px; }
			.rooms label { display: flex; gap: 6px; align-items: center; margin: 2px 0; }
			.rooms .count { color: var(--muted); font-size: 11px; }
		</style>
		<script>
			let websocket = null, uuid = null, actionInfo = null;
			let global = {};
			let areas = [];
			const $ = (id) => document.getElementById(id);
			const STATUS = {
				NotConfigured: "Enter your Home Assistant URL and a long-lived token.",
				Connecting: "Connecting…",
				AuthFailed: "Home Assistant rejected the token.",
				Unreachable: "Cannot reach Home Assistant. Retrying.",
				Ready: "Connected.",
			};

			function send(obj) { websocket?.readyState === 1 && websocket.send(JSON.stringify(obj)); }
			function toPlugin(payload) { send({ event: "sendToPlugin", action: actionInfo.action, context: uuid, payload }); }

			function save() {
				global = {
					...global,
					url: $("url").value.trim(),
					token: $("token").value.trim(),
					timeoutSecs: Math.max(0, Number($("timeout").value) || 0),
					holdSecs: Math.min(3, Math.max(0.2, Number($("hold").value) || 0.5)),
					autoPage: $("autoPage").checked,
					hiddenAreas: [...document.querySelectorAll(".rooms input")].filter((i) => !i.checked).map((i) => i.value),
				};
				send({ event: "setGlobalSettings", context: uuid, payload: global });
				setTimeout(() => toPlugin({ event: "status" }), 1500);
			}

			function load(s) {
				global = s ?? {};
				$("url").value = global.url ?? "";
				$("token").value = global.token ?? "";
				$("timeout").value = global.timeoutSecs ?? 30;
				$("hold").value = global.holdSecs ?? 0.5;
				$("autoPage").checked = global.autoPage ?? true;
				renderAreas();
			}

			function renderAreas() {
				const hidden = new Set(global.hiddenAreas ?? []);
				const box = $("rooms");
				box.textContent = "";
				for (const a of areas) {
					const label = document.createElement("label");
					const cb = document.createElement("input");
					cb.type = "checkbox"; cb.value = a.id; cb.checked = !hidden.has(a.id); cb.onchange = save;
					const span = document.createElement("span"); span.textContent = a.name;
					const count = document.createElement("span"); count.className = "count"; count.textContent = a.entities ? `${a.entities} devices` : "";
					label.append(cb, span, count);
					box.append(label);
				}
				$("roomsSection").style.display = areas.length ? "" : "none";
			}

			function connectElgatoStreamDeckSocket(inPort, inUUID, inRegisterEvent, inInfo, inActionInfo) {
				uuid = inUUID;
				actionInfo = JSON.parse(inActionInfo);
				websocket = new WebSocket("ws://127.0.0.1:" + inPort);
				websocket.onopen = () => {
					send({ event: inRegisterEvent, uuid: inUUID });
					send({ event: "getGlobalSettings", context: inUUID });
					toPlugin({ event: "status" });
				};
				websocket.onmessage = (msg) => {
					const data = JSON.parse(msg.data);
					if (data.event === "didReceiveGlobalSettings") {
						load(data.payload.settings);
					} else if (data.event === "sendToPropertyInspector" && data.payload?.event === "status") {
						const p = data.payload;
						$("status").textContent = STATUS[p.status] ?? p.status;
						$("status").className = p.status;
						const counts = Object.fromEntries((p.rooms ?? []).map((r) => [r.id, r.entities]));
						areas = (p.areas ?? []).map((a) => ({ ...a, entities: counts[a.id] }));
						renderAreas();
						$("deck").textContent = p.deck ? `Deck: ${p.deck}` : "";
					}
				};
			}
			const connectOpenActionSocket = connectElgatoStreamDeckSocket;
		</script>
	</head>
	<body>
		<div class="row"><label for="url">HA URL</label><input id="url" type="url" placeholder="http://homeassistant.local:8123" onchange="save()" /></div>
		<div class="row"><label for="token">Access token</label><input id="token" type="password" placeholder="Long-lived access token" onchange="save()" /></div>
		<div class="hint">In Home Assistant: your profile → Security → Long-lived access tokens → Create token.</div>
		<div id="status"></div>
		<div class="row"><button onclick="toPlugin({ event: 'reconnect' })">Reconnect</button><button onclick="toPlugin({ event: 'createPage' })">Create Home Assistant page</button></div>
		<details>
			<summary>Behaviour</summary>
			<div class="row"><label for="timeout">Back to rooms</label><input id="timeout" type="number" min="0" step="5" onchange="save()" /><span>s idle (0 = never)</span></div>
			<div class="row"><label for="hold">Hold to open</label><input id="hold" type="number" min="0.2" max="3" step="0.1" onchange="save()" /><span>s</span></div>
			<div class="row"><label for="autoPage">Auto page</label><input id="autoPage" type="checkbox" onchange="save()" /><span>Create the page on new decks</span></div>
		</details>
		<details id="roomsSection" open>
			<summary>Rooms on the deck</summary>
			<div id="rooms" class="rooms"></div>
		</details>
		<div class="hint" id="deck" style="margin-left: 0"></div>
	</body>
</html>
