[package]
name = "opendeck-homeassistant"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "OpenDeck plugin: a Home Assistant remote with rooms, knobs and automatic layout"

[dependencies]
openaction = "2.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net", "io-util"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
image = { version = "0.25", default-features = false, features = ["png"] }
ab_glyph = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
log = "0.4"
simplelog = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
