[package]
name = "opendeck-shortcut"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "OpenDeck plugin: press a keyboard shortcut (key combo with modifiers) from a key or knob"

[dependencies]
openaction = "2.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
simplelog = "0.12"
image = { version = "0.25", default-features = false, features = ["png"] }
ab_glyph = "0.2"
base64 = "0.22"
dashmap = "6"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
