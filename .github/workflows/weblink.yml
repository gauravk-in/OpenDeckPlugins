name: Web Link

on:
  push:
    branches: [main]
    paths: ["weblink/**", ".github/workflows/weblink.yml"]
    tags: ["weblink-v*"]
  pull_request:
    paths: ["weblink/**", ".github/workflows/weblink.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: weblink

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu,x86_64-unknown-linux-gnu,x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: weblink
      - name: Install zig and cargo-zigbuild
        run: |
          pip install ziglang
          cargo install --locked cargo-zigbuild
      - name: Test
        run: cargo test --release
      - name: Package
        run: scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: opendeck-weblink-plugin
          path: weblink/dist/*.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/weblink-v')
        uses: softprops/action-gh-release@v2
        with:
          files: weblink/dist/*.zip
