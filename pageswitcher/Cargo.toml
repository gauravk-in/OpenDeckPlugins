[package]
name = "opendeck-pageswitcher"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "OpenDeck plugin: switch between pages (profiles) in order with a dial or keys"

[dependencies]
openaction = "2.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
simplelog = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
