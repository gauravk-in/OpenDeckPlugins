[package]
name = "opendeck-mediaknob"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "OpenDeck plugin: control media with a knob (volume, seek or tracks; play/pause or mute on press)"

[dependencies]
openaction = "2.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
simplelog = "0.12"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
